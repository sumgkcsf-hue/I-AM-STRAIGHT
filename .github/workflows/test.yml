name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rules and tool files are in sync
        run: |
          python scripts/sync.py
          git diff --exit-code
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Examples are easy to read
        run: python checker/straight_check.py RULES.md || true
